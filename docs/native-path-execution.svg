<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
  <title id="title">DS41RT automatic one or two RTX execution with four DGX Spark workers</title>
  <desc id="desc">The launcher selects two peer-connected RTX PRO 6000 GPUs when memory permits and otherwise uses one. In the qualified two-GPU layout, RTX0 owns embeddings, vision, layers 0 through 13, and compressed sources 2 and 8. RTX1 owns layers 14 through 39, compressed sources 14 and 20, and dSpark. Both GPUs execute tensor-parallel bottom-up routed experts, shared experts, and vocabulary selection. Four DGX Spark workers retain routed experts above the published boundary. Two asynchronous serving lanes support sixteen active requests with FP4 compressed KV, FP8 sliding-window attention, pinned-RAM snapshots, and twenty retained turns.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#07111f"/>
      <stop offset="1" stop-color="#0b1728"/>
    </linearGradient>
    <linearGradient id="gpu0" x2="1" y2="1">
      <stop stop-color="#102944"/>
      <stop offset="1" stop-color="#0d2037"/>
    </linearGradient>
    <linearGradient id="gpu1" x2="1" y2="1">
      <stop stop-color="#25204a"/>
      <stop offset="1" stop-color="#161d3b"/>
    </linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#56d7e8"/>
    </marker>
    <style>
      text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#c7d8e8}
      .title{font-size:31px;font-weight:700;fill:#f1f7ff}
      .subtitle{font-size:16px;fill:#93abc0}
      .section{font-size:21px;font-weight:700;fill:#f1f7ff}
      .label{font-size:17px;font-weight:700;fill:#edf6ff}
      .body{font-size:15px}
      .small{font-size:13px;fill:#91a8bf}
      .metric{font-size:21px;font-weight:700;fill:#f1f7ff}
      .metric-label{font-size:12px;fill:#91a8bf;letter-spacing:.7px}
    </style>
  </defs>

  <rect width="1600" height="1100" fill="url(#background)"/>
  <text x="40" y="51" class="title">DS41RT · BALANCED NATIVE EXECUTION</text>
  <text x="40" y="80" class="subtitle">DeepSeek V4.1 Flash · automatic 1× / 2× RTX PRO 6000 · four DGX Spark expert workers</text>

  <g aria-label="headline performance">
    <rect x="40" y="105" width="370" height="68" rx="12" fill="#0d1e32" stroke="#5d8cff" stroke-width="1.4"/>
    <text x="59" y="135" class="metric">8,355 tok/s</text>
    <text x="59" y="158" class="metric-label">BEST 2×RTX PREFILL</text>
    <rect x="423" y="105" width="370" height="68" rx="12" fill="#0d1e32" stroke="#56d7e8" stroke-width="1.4"/>
    <text x="442" y="135" class="metric">109.44 tok/s</text>
    <text x="442" y="158" class="metric-label">WEIGHTED DSPARK DECODE</text>
    <rect x="806" y="105" width="370" height="68" rx="12" fill="#0d1e32" stroke="#a978ff" stroke-width="1.4"/>
    <text x="825" y="135" class="metric">1,195.37 tok/s</text>
    <text x="825" y="158" class="metric-label">C16 CODE AGGREGATE</text>
    <rect x="1189" y="105" width="371" height="68" rx="12" fill="#0d1e32" stroke="#56d69c" stroke-width="1.4"/>
    <text x="1208" y="135" class="metric">284.69 tok/s</text>
    <text x="1208" y="158" class="metric-label">C16 MIXED AGGREGATE</text>
  </g>

  <g aria-label="automatic GPU selection">
    <rect x="40" y="196" width="1520" height="82" rx="14" fill="#0d1e32" stroke="#56d69c" stroke-width="1.4"/>
    <text x="61" y="226" class="section">Automatic release layout</text>
    <text x="61" y="253" class="body">Inventory free memory + bidirectional peer reads before replacement · prefer 2×RTX when the complete 14M-token GPU plan fits · fall back to 1×RTX</text>
    <rect x="1190" y="211" width="346" height="48" rx="10" fill="#102a30" stroke="#56d69c"/>
    <text x="1363" y="232" class="label" text-anchor="middle">C16 · 20 retained turns</text>
    <text x="1363" y="250" class="small" text-anchor="middle">two independent serving lanes</text>
  </g>

  <g aria-label="RTX zero">
    <rect x="40" y="308" width="735" height="414" rx="18" fill="url(#gpu0)" stroke="#5d8cff" stroke-width="1.6"/>
    <text x="64" y="342" class="section">RTX0 · encoder owner</text>
    <text x="64" y="366" class="small">lower-stack inputs and consumers of compressed sources 2 / 8</text>

    <rect x="64" y="390" width="324" height="135" rx="12" fill="#10243a" stroke="#56d7e8"/>
    <text x="83" y="419" class="label">Admission + encoder path</text>
    <text x="83" y="447" class="body">Embeddings and vision</text>
    <text x="83" y="471" class="body">Attention / mHC / routers 0–13</text>
    <text x="83" y="495" class="body">FP8 SWA 0–13</text>

    <rect x="411" y="390" width="340" height="135" rx="12" fill="#10243a" stroke="#5d8cff"/>
    <text x="430" y="419" class="label">FP4 cache ownership</text>
    <text x="430" y="447" class="body">Sources 2, 8 + indices</text>
    <text x="430" y="471" class="body">2/5 of global source storage</text>
    <text x="430" y="495" class="body">No remote attention reads</text>

    <rect x="64" y="549" width="687" height="145" rx="12" fill="#0e2035" stroke="#a9b8ff"/>
    <text x="83" y="578" class="label">Tensor-parallel work · rank 0 halves</text>
    <text x="83" y="606" class="body">Encoder routed experts 0–19 · shared experts 0–39</text>
    <text x="83" y="632" class="body">Half vocabulary rows → local top-1 candidate</text>
    <text x="83" y="658" class="body">Lane-owned target workspaces · asynchronous peer events</text>
    <text x="83" y="681" class="small">Vision stays here because it is infrequent; embeddings remain next to layer 0.</text>
  </g>

  <g aria-label="RTX one">
    <rect x="825" y="308" width="735" height="414" rx="18" fill="url(#gpu1)" stroke="#a978ff" stroke-width="1.6"/>
    <text x="849" y="342" class="section">RTX1 · decoder + draft owner</text>
    <text x="849" y="366" class="small">upper-stack attention, compressed sources 14 / 20, and lane-local dSpark</text>

    <rect x="849" y="390" width="324" height="135" rx="12" fill="#1c2140" stroke="#a978ff"/>
    <text x="868" y="419" class="label">Decoder path</text>
    <text x="868" y="447" class="body">Attention / mHC / routers 14–39</text>
    <text x="868" y="471" class="body">FP8 SWA 14–39</text>
    <text x="868" y="495" class="body">FP4 sources 14 / 20 · 3/5 storage</text>

    <rect x="1196" y="390" width="340" height="135" rx="12" fill="#1c2140" stroke="#56d69c"/>
    <text x="1215" y="419" class="label">dSpark · adaptive K5</text>
    <text x="1215" y="447" class="body">Three native draft blocks</text>
    <text x="1215" y="471" class="body">Lane-local draft workspaces</text>
    <text x="1215" y="495" class="body">Placement-aware verify length</text>

    <rect x="849" y="549" width="687" height="145" rx="12" fill="#171d39" stroke="#a9b8ff"/>
    <text x="868" y="578" class="label">Tensor-parallel work · rank 1 halves</text>
    <text x="868" y="606" class="body">Encoder routed experts 0–19 · shared experts 0–39</text>
    <text x="868" y="632" class="body">Half vocabulary rows → local top-1 candidate</text>
    <text x="868" y="658" class="body">Deterministic global token winner · no full-vocabulary download</text>
    <text x="868" y="681" class="small">Fixed mask embedding is local; lane seed rows arrive through tiny asynchronous copies.</text>
  </g>

  <path d="M775 565 H825" fill="none" stroke="#56d7e8" stroke-width="2.2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="800" y="545" class="small" text-anchor="middle">P2P</text>

  <g aria-label="DGX Spark expert workers">
    <rect x="40" y="764" width="1520" height="215" rx="18" fill="#0d1e32" stroke="#56d69c" stroke-width="1.5"/>
    <text x="64" y="799" class="section">Four DGX Spark ranks · decoder routed experts 20–39</text>
    <text x="64" y="824" class="small">Each worker keeps one TP4 slice under a 100 GiB device budget · persistent dual-rail transport · encoder layers are absent in 2×RTX mode</text>

    <rect x="64" y="851" width="343" height="94" rx="12" fill="#102a30" stroke="#56d69c"/>
    <text x="84" y="881" class="label">Rank 0 · ostrich</text>
    <text x="84" y="908" class="body">decoder expert TP4 slice</text>
    <text x="84" y="930" class="small">layers 20–39</text>
    <rect x="440" y="851" width="343" height="94" rx="12" fill="#102a30" stroke="#56d69c"/>
    <text x="460" y="881" class="label">Rank 1 · dodo</text>
    <text x="460" y="908" class="body">decoder expert TP4 slice</text>
    <text x="460" y="930" class="small">layers 20–39</text>
    <rect x="816" y="851" width="343" height="94" rx="12" fill="#102a30" stroke="#56d69c"/>
    <text x="836" y="881" class="label">Rank 2 · emu</text>
    <text x="836" y="908" class="body">decoder expert TP4 slice</text>
    <text x="836" y="930" class="small">layers 20–39</text>
    <rect x="1192" y="851" width="344" height="94" rx="12" fill="#102a30" stroke="#56d69c"/>
    <text x="1212" y="881" class="label">Rank 3 · kiwi</text>
    <text x="1212" y="908" class="body">decoder expert TP4 slice</text>
    <text x="1212" y="930" class="small">layers 20–39</text>
  </g>

  <path d="M800 722 V758" fill="none" stroke="#56d7e8" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="820" y="749" class="small">20 fewer RDMA expert rounds per target pass</text>

  <g aria-label="cache and fallback policy">
    <rect x="40" y="1005" width="475" height="58" rx="11" fill="#0d1e32" stroke="#5d8cff"/>
    <text x="58" y="1030" class="label">13.091 GB GPU + 6.75 GiB pinned RAM</text>
    <text x="58" y="1051" class="small">14,680,064 + 6,291,968 = 20,972,032 tokens</text>
    <rect x="532" y="1005" width="475" height="58" rx="11" fill="#0d1e32" stroke="#56d7e8"/>
    <text x="550" y="1030" class="label">Exact reuse + bounded replay</text>
    <text x="550" y="1051" class="small">FP8 SWA · final 128 encoder tokens · 20 turns</text>
    <rect x="1024" y="1005" width="536" height="58" rx="11" fill="#0d1e32" stroke="#a978ff"/>
    <text x="1042" y="1030" class="label">1×RTX fallback</text>
    <text x="1042" y="1051" class="small">layers 0–4 local · Sparks 0–39 · placement-aware K5</text>
  </g>

  <text x="40" y="1085" class="small">Qualified release design · schematic, not a measured timeline · 400 W RTX limit · standard memory speed</text>
</svg>
