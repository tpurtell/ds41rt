<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
<title id="title">DS41RT v7 serving configurations</title>
<desc id="desc">Four v7 serving configurations drawn as device memory bars: the NVFP4 W4A4 quant on one or two RTX cards with four Spark workers, and the EXL3 2 bpw quant on two RTX cards or one simulated 32 GiB RTX 5090 with two Spark workers. Coloured bands show each device's memory use, with measured code-decode and best observed prefill throughput beneath.</desc>
<defs><style>
text{font-family:Arial,Helvetica,sans-serif;fill:#e4ecf8}
.title{font-size:28px;font-weight:700}
.panel{font-size:19px;font-weight:700}
.sub{font-size:14px;fill:#8fa3bd}
.device{font-size:15px;fill:#c7d6ea}
.band{font-size:13px;fill:#08111f;font-weight:700}
.speed{font-size:16px}
.speedbig{font-size:21px;font-weight:700;fill:#74e4c4}
.legend{font-size:15px}
.pending{font-size:15px;fill:#f2b45c}
</style></defs>
<rect width="1400" height="900" rx="18" fill="#091423"/>
<text x="40" y="50" class="title">V7 · four configurations</text>
<text x="40" y="74" class="sub">Bar height is device memory; bands are measured use, the remainder is free.</text>
<text x="40" y="96" class="sub">Bands are measured memory in use; the unfilled remainder to each bar's top is free. Dashed bars are configurations whose campaign has not run yet.</text>
<rect x="40" y="124" width="312" height="710" rx="12" fill="#0e1c2f" stroke="#35506c" stroke-width="1.5"/>
