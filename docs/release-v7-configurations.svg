<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
<title id="title">DS41RT v7 serving configurations</title>
<desc id="desc">Four serving configurations drawn as device memory bars: the MXFP4 original on one and two RTX cards with four Spark workers, and the EXL3 2 bpw quant on two RTX cards or one simulated 32 GiB RTX 5090 with two Spark workers. Colour-coded bands show memory use, with measured code-decode and best observed prefill throughput beneath each configuration.</desc>
<defs><style>
text{font-family:Arial,Helvetica,sans-serif;fill:#e4ecf8}
.title{font-size:27px;font-weight:700}
.panel{font-size:17px;font-weight:700}
.sub{font-size:13px;fill:#8fa3bd}
.device{font-size:14px;fill:#c7d6ea}
.band{font-size:12px;fill:#08111f;font-weight:700}
.legend{font-size:14px}
.colhead{font-size:12px;fill:#8fa3bd}
.speed{font-size:15px}
.tps{font-size:16px;font-weight:700;fill:#74e4c4}
.pending{font-size:15px;fill:#f2b45c}
</style></defs>
<rect width="1400" height="900" rx="18" fill="#091423"/>
<text x="40" y="44" class="title">V7 · four configurations</text>
<text x="40" y="70" class="sub">Full height is device memory; colour-coded bands are measured use and the space above them is free.</text>
<text x="40" y="90" class="sub">A dash is a configuration whose campaign has not run yet or whose profile is not implemented.</text>
