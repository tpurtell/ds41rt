<title id="title">DS41RT v7 serving configurations</title>
<desc id="desc">Logged partial allocation bands in GiB, not total VRAM or free space. Official throughput is historical v6; NVFP4 and EXL3 throughput is v7 WIP. Compact measurements use an RTX PRO 6000 with a 32 GiB ceiling, not a physical RTX 5090. Release Docker image publication remains pending.</desc>
