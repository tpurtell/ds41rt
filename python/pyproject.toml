[project]
name = "ds41rt-reference"
version = "0.1.0"
description = "Reference and oracle utilities for DS41RT phase0"
requires-python = ">=3.12"
dependencies = [
  "pytest>=8",
  "safetensors>=0.4",
  "huggingface-hub>=0.24",
  "tokenizers>=0.23.1",
]

[project.optional-dependencies]
torch = ["torch"]
test = [
    "pytest>=8",
    "numpy>=2",
    "xgrammar==0.2.6",
]

exl3 = [
  "torch>=2.6.0",
  "numpy>=2.1.0",
  "rich",
  "typing-extensions",
  "ninja",
  "pillow",
  "pyyaml",
  "marisa-trie",
  "kbnf>=0.4.2",
  "pydantic",
  "formatron>=0.5.0",
  "flash-linear-attention>=0.5.0",
]
[tool.pytest.ini_options]
testpaths = ["reference/tests", "tests"]
pythonpath = [".", "reference"]
